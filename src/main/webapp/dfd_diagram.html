<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Data Flow Diagram – Campus Complaint System</title>
  <style>
    body { margin:0; padding:30px; background:#f2f2f2; font-family:'Times New Roman',serif; display:flex; flex-direction:column; align-items:center; }
    h1 { font-size:18px; text-transform:uppercase; letter-spacing:1px; border-bottom:2px solid #222; padding-bottom:6px; margin-bottom:20px; }
    .sheet { background:#fff; border:2px solid #333; padding:28px 36px; box-shadow:5px 5px 14px rgba(0,0,0,.2); }
  </style>
</head>
<body>
<h1>Data Flow Diagram – Campus Complaint System</h1>
<div class="sheet">
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1090" viewBox="0 0 840 1090">
<defs>
  <!-- Arrow pointing right -->
  <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
  </marker>
  <!-- Arrow pointing left -->
  <marker id="al" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto">
    <path d="M9,0 L9,6 L0,3 z" fill="#111"/>
  </marker>
</defs>

<!-- ═══════════════════════════════════════════
     STUDENT / USER  SECTION
═══════════════════════════════════════════ -->

<!-- USER entity (double border) -->
<rect x="18" y="26" width="112" height="62" fill="white" stroke="#111" stroke-width="2"/>
<rect x="25" y="33" width="98"  height="48" fill="white" stroke="#111" stroke-width="1.3"/>
<text x="74" y="57"  text-anchor="middle" font-size="15" font-weight="bold">STUDENT</text>
<text x="74" y="74"  text-anchor="middle" font-size="12">(USER)</text>

<!-- Vertical spine from USER down -->
<line x1="74" y1="88" x2="74" y2="490" stroke="#111" stroke-width="1.8"/>

<!-- ─── PROCESS 1 : REGISTRATION / LOGIN FORM ─── -->
<!-- Ellipse -->
<ellipse cx="554" cy="157" rx="120" ry="50" fill="white" stroke="#111" stroke-width="2"/>
<text x="554" y="149" text-anchor="middle" font-size="13.5" font-weight="bold">REGISTRATION</text>
<text x="554" y="166" text-anchor="middle" font-size="13.5" font-weight="bold">/ LOGIN FORM</text>

<!-- Spine branch lines -->
<line x1="74" y1="140" x2="130" y2="140" stroke="#111" stroke-width="1.5"/>
<line x1="74" y1="174" x2="130" y2="174" stroke="#111" stroke-width="1.5"/>

<!-- → Login / Register -->
<line x1="130" y1="140" x2="432" y2="140" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="280" y="130" text-anchor="middle" font-size="12">Login/ Register</text>

<!-- ← Successful registration / login -->
<line x1="432" y1="174" x2="130" y2="174" stroke="#111" stroke-width="1.5" marker-end="url(#al)"/>
<text x="280" y="192" text-anchor="middle" font-size="12">Successful registration / login</text>

<!-- DATA STORE: users table -->
<line x1="710" y1="138" x2="830" y2="138" stroke="#111" stroke-width="2"/>
<line x1="710" y1="168" x2="830" y2="168" stroke="#111" stroke-width="2"/>
<line x1="710" y1="138" x2="710" y2="168" stroke="#111" stroke-width="2"/>
<text x="770" y="157" text-anchor="middle" font-size="12">users table</text>

<!-- → store -->
<line x1="674" y1="144" x2="708" y2="144" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="691" y="134" text-anchor="middle" font-size="11.5">store</text>
<!-- ← Retrieve -->
<line x1="708" y1="162" x2="674" y2="162" stroke="#111" stroke-width="1.5" marker-end="url(#al)"/>
<text x="691" y="177" text-anchor="middle" font-size="11.5">Retrieve</text>

<!-- ─── PROCESS 2 : COMPLAINT SUBMISSION FORM ─── -->
<ellipse cx="554" cy="307" rx="120" ry="50" fill="white" stroke="#111" stroke-width="2"/>
<text x="554" y="299" text-anchor="middle" font-size="13.5" font-weight="bold">COMPLAINT</text>
<text x="554" y="316" text-anchor="middle" font-size="13.5" font-weight="bold">SUBMISSION FORM</text>

<line x1="74" y1="290" x2="130" y2="290" stroke="#111" stroke-width="1.5"/>
<line x1="74" y1="324" x2="130" y2="324" stroke="#111" stroke-width="1.5"/>

<!-- → Fill the form and submit -->
<line x1="130" y1="290" x2="432" y2="290" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="280" y="280" text-anchor="middle" font-size="12">Fill the form and submit</text>

<!-- ← Successful submission of the form -->
<line x1="432" y1="324" x2="130" y2="324" stroke="#111" stroke-width="1.5" marker-end="url(#al)"/>
<text x="280" y="342" text-anchor="middle" font-size="12">Successful submission of the form</text>

<!-- DATA STORE: complaints table -->
<line x1="710" y1="288" x2="830" y2="288" stroke="#111" stroke-width="2"/>
<line x1="710" y1="318" x2="830" y2="318" stroke="#111" stroke-width="2"/>
<line x1="710" y1="288" x2="710" y2="318" stroke="#111" stroke-width="2"/>
<text x="766" y="307" text-anchor="middle" font-size="11.5">complaints table</text>

<!-- → store -->
<line x1="674" y1="294" x2="708" y2="294" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="691" y="284" text-anchor="middle" font-size="11.5">store</text>
<!-- ← Retrieve -->
<line x1="708" y1="312" x2="674" y2="312" stroke="#111" stroke-width="1.5" marker-end="url(#al)"/>
<text x="691" y="327" text-anchor="middle" font-size="11.5">Retrieve</text>

<!-- ─── PROCESS 3 : TRACK COMPLAINT ─── -->
<ellipse cx="554" cy="450" rx="120" ry="50" fill="white" stroke="#111" stroke-width="2"/>
<text x="554" y="443" text-anchor="middle" font-size="13.5" font-weight="bold">TRACK</text>
<text x="554" y="460" text-anchor="middle" font-size="13.5" font-weight="bold">COMPLAINT</text>

<line x1="74" y1="434" x2="130" y2="434" stroke="#111" stroke-width="1.5"/>
<line x1="74" y1="466" x2="130" y2="466" stroke="#111" stroke-width="1.5"/>

<!-- → Request to track complaint -->
<line x1="130" y1="434" x2="432" y2="434" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="280" y="424" text-anchor="middle" font-size="12">Request to track complaint</text>

<!-- ← Complaint status and details -->
<line x1="432" y1="466" x2="130" y2="466" stroke="#111" stroke-width="1.5" marker-end="url(#al)"/>
<text x="280" y="484" text-anchor="middle" font-size="12">Complaint status &amp; details</text>

<!-- DIVIDER -->
<line x1="0" y1="520" x2="840" y2="520" stroke="#bbb" stroke-width="1" stroke-dasharray="9,6"/>

<!-- ═══════════════════════════════════════════
     ADMIN  SECTION
═══════════════════════════════════════════ -->

<!-- Admin entity (double border) -->
<rect x="18" y="542" width="112" height="62" fill="white" stroke="#111" stroke-width="2"/>
<rect x="25" y="549" width="98"  height="48" fill="white" stroke="#111" stroke-width="1.3"/>
<text x="74" y="580" text-anchor="middle" font-size="17" font-weight="bold">Admin</text>

<!-- Vertical spine from Admin down -->
<line x1="74" y1="604" x2="74" y2="1020" stroke="#111" stroke-width="1.8"/>

<!-- DATA STORE: complaints table (admin section) -->
<line x1="706" y1="526" x2="830" y2="526" stroke="#111" stroke-width="2"/>
<line x1="706" y1="562" x2="830" y2="562" stroke="#111" stroke-width="2"/>
<line x1="706" y1="526" x2="706" y2="562" stroke="#111" stroke-width="2"/>
<text x="768" y="541" text-anchor="middle" font-size="12">complaints</text>
<text x="768" y="556" text-anchor="middle" font-size="12">table</text>

<!-- ─── PROCESS 4 : ADMIN LOGIN ─── -->
<ellipse cx="520" cy="632" rx="84" ry="40" fill="white" stroke="#111" stroke-width="2"/>
<text x="520" y="637" text-anchor="middle" font-size="14" font-weight="bold">Login</text>

<line x1="74" y1="618" x2="130" y2="618" stroke="#111" stroke-width="1.5"/>
<line x1="74" y1="646" x2="130" y2="646" stroke="#111" stroke-width="1.5"/>

<!-- → Login -->
<line x1="130" y1="618" x2="434" y2="618" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="280" y="608" text-anchor="middle" font-size="12">Login</text>
<!-- ← Confirmation -->
<line x1="434" y1="646" x2="130" y2="646" stroke="#111" stroke-width="1.5" marker-end="url(#al)"/>
<text x="280" y="664" text-anchor="middle" font-size="12">Confirmation</text>

<!-- ─── PROCESS 5 : VIEW / FILTER COMPLAINTS ─── -->
<ellipse cx="520" cy="755" rx="122" ry="52" fill="white" stroke="#111" stroke-width="2"/>
<text x="520" y="747" text-anchor="middle" font-size="13" font-weight="bold">View Application/</text>
<text x="520" y="763" text-anchor="middle" font-size="13" font-weight="bold">filter application</text>

<line x1="74" y1="736" x2="130" y2="736" stroke="#111" stroke-width="1.5"/>
<line x1="74" y1="768" x2="130" y2="768" stroke="#111" stroke-width="1.5"/>

<!-- → Request for viewing students application -->
<line x1="130" y1="736" x2="396" y2="736" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="262" y="724" text-anchor="middle" font-size="11.5">Request for viewing students</text>
<text x="262" y="736" text-anchor="middle" font-size="11.5">application</text>

<!-- ← Requested applications -->
<line x1="396" y1="768" x2="130" y2="768" stroke="#111" stroke-width="1.5" marker-end="url(#al)"/>
<text x="262" y="784" text-anchor="middle" font-size="12">Requested applications</text>

<!-- View → complaints table (Request for data) -->
<line x1="642" y1="736" x2="708" y2="556" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="692" y="648" text-anchor="middle" font-size="11.5">Request for data</text>

<!-- complaints table → View (Data) -->
<line x1="712" y1="560" x2="644" y2="752" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="720" y="672" text-anchor="middle" font-size="12">Data</text>

<!-- ─── PROCESS 6 : UPDATE STATUS / REVIEW NOTE ─── -->
<ellipse cx="520" cy="876" rx="122" ry="52" fill="white" stroke="#111" stroke-width="2"/>
<text x="520" y="868" text-anchor="middle" font-size="13" font-weight="bold">Update status</text>
<text x="520" y="884" text-anchor="middle" font-size="13" font-weight="bold">/review note</text>

<line x1="74" y1="856" x2="130" y2="856" stroke="#111" stroke-width="1.5"/>
<line x1="74" y1="888" x2="130" y2="888" stroke="#111" stroke-width="1.5"/>

<!-- → Updating status and add review note -->
<line x1="130" y1="856" x2="396" y2="856" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="262" y="844" text-anchor="middle" font-size="11.5">Updating status and add review note</text>

<!-- ← Confirmation message -->
<line x1="396" y1="888" x2="130" y2="888" stroke="#111" stroke-width="1.5" marker-end="url(#al)"/>
<text x="262" y="906" text-anchor="middle" font-size="12">Confirmation message</text>

<!-- Update → complaints table (Updated status information and review note) -->
<line x1="642" y1="856" x2="720" y2="560" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="714" y="710" text-anchor="middle" font-size="10.5">Updated status information</text>
<text x="714" y="722" text-anchor="middle" font-size="10.5">and review note</text>

<!-- complaints table → Update (Confirmation) -->
<line x1="724" y1="562" x2="644" y2="866" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="734" y="736" text-anchor="middle" font-size="12">Confirmation</text>

<!-- ─── PROCESS 7 : EXPORT AS PDF / EXCEL ─── -->
<ellipse cx="520" cy="990" rx="122" ry="52" fill="white" stroke="#111" stroke-width="2"/>
<text x="520" y="980" text-anchor="middle" font-size="13" font-weight="bold">Export as</text>
<text x="520" y="996" text-anchor="middle" font-size="13" font-weight="bold">application as</text>
<text x="520" y="1012" text-anchor="middle" font-size="13" font-weight="bold">pdf/ excel sheet</text>

<line x1="74" y1="970" x2="130" y2="970" stroke="#111" stroke-width="1.5"/>
<line x1="74" y1="1004" x2="130" y2="1004" stroke="#111" stroke-width="1.5"/>

<!-- → Request to access application in pdf / excel format -->
<line x1="130" y1="970" x2="396" y2="970" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="262" y="956" text-anchor="middle" font-size="11">Request to acess application in pdf/ excel format</text>

<!-- ← Application in pdf / excel format -->
<line x1="396" y1="1004" x2="130" y2="1004" stroke="#111" stroke-width="1.5" marker-end="url(#al)"/>
<text x="262" y="1022" text-anchor="middle" font-size="12">Application in pdf / excel format</text>

<!-- Export → complaints table (Request for data) -->
<line x1="642" y1="970" x2="728" y2="562" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="727" y="768" text-anchor="middle" font-size="10.5">Request for data</text>

<!-- complaints table → Export (Data) -->
<line x1="732" y1="564" x2="644" y2="982" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="742" y="792" text-anchor="middle" font-size="12">Data</text>

</svg>
</div>
</body>
</html>
