<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - CampusCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-anim"></div>
    <div class="nav-overlay" id="nav-overlay"></div>
    <header class="glass-header">
        <a href="index.html" style="text-decoration:none;"><div class="logo">CampusCare</div></a>
        <button class="hamburger" id="hamburger" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <nav id="main-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="student_register.html" class="nav-link">Register</a>
        </nav>
    </header>

    <div class="auth-container">
        <div class="glass-card auth-card">
            <h2 class="auth-title">Student Login</h2>
            
            <div id="error-alert" class="alert alert-error"></div>
            <div id="success-alert" class="alert alert-success"></div>
            
            <form action="StudentLoginServlet" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="student@campus.edu" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary submit-btn">Login</button>
            </form>
            
            <div class="auth-links">
                Don't have an account? <a href="student_register.html">Register here</a>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
